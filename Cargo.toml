[package]
name = "briaf"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"

[features]
default = ["libm"]
std = ["harfrust/std", "skrifa/std", "zeno/std"]
libm = ["harfrust/libm", "skrifa/libm", "zeno/libm"]

[dependencies]
harfrust = { version = "0.14", default-features = false }
skrifa = { version = "0.48", default-features = false }
zeno = { version = "0.3", default-features = false }

[dev-dependencies]
criterion = "0.8"
proptest = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
