[package]
name = "briaf"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
license = "MIT OR Apache-2.0"

[features]
default = ["std"]
std = [
    "fontdb/default",
    "harfrust/std",
    "skrifa/std",
    "zeno/std",
]
no_std = [
    "harfrust/libm",
    "skrifa/libm",
    "unicode-segmentation/no_std",
    "zeno/libm",
]

[dependencies]
fontdb = { version = "0.24", default-features = false }
harfrust = { version = "0.14", default-features = false }
hashbrown = "0.17"
skrifa = { version = "0.48", default-features = false }
unicode-segmentation = "1.13"
zeno = { version = "0.3", default-features = false }

[dev-dependencies]
criterion = "0.8"
proptest = "1"

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
